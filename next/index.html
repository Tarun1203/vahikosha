    /* Logged out from another device (Settings -> Devices): wipe what this device
       keeps -- sign-in, saved passphrase key, offline copy of the data -- before
       anything opens it again. The same in the old app (/) and the new app (next/). */
    (function(){
      try{
        if(localStorage.getItem('cem_wipe') !== '1') return;
        localStorage.clear(); sessionStorage.clear();
        ['chittam-crypto', 'firebaseLocalStorageDb', 'firestore/[DEFAULT]/chittam-enterprises/main',
         'firestore/chittam-next/chittam-enterprises/main'].forEach(function(n){ indexedDB.deleteDatabase(n); });
        if(indexedDB.databases) indexedDB.databases().then(function(l){ l.forEach(function(d){ if(d.name) indexedDB.deleteDatabase(d.name); }); });
      }catch(e){}
    })();
    </script>
